# OpenEvolve config for libbpf-tools BPF C compile optimization.

max_iterations: 50
checkpoint_interval: 10
log_level: "INFO"
language: "c"
file_suffix: ".bpf.c"

llm:
  primary_model: "gpt-5-mini"
  primary_model_weight: 0.8
  secondary_model: "gpt-5-nano"
  secondary_model_weight: 0.2
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120
  system_message: |
    You are an expert eBPF/libbpf C programmer optimizing a program for execution
    time (nanoseconds per program run). Make any change you can justify as
    preserving the program's observable behavior -- its return value and its final
    map state for every input -- while making it run faster or emit fewer
    instructions. Keep the code verifier-safe: bounded loops, no new unbounded or
    disallowed helpers, valid SEC() annotations, the required includes, and the
    license declaration all intact. Do not change which probes / SEC sections
    exist or what kernel events they attach to, and do not replace the program
    with a trivial stub just to compile.

prompt:
  template_dir: prompt_templates
  num_top_programs: 4
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 8192
  system_message: |
    Optimize a libbpf-tools BPF C source file for execution time. Make any change
    that preserves the program's observable behavior (its return value and its
    final map state for every input). The evaluator compiles the complete file
    with clang -g -O2 -target bpf -D__TARGET_ARCH_x86 and reports compiler
    diagnostics, then symbolically checks the result against the original. Return
    a complete valid C source file.

database:
  population_size: 40
  archive_size: 20
  num_islands: 2
  feature_dimensions:
    - "compile_success"
    - "semantic_equivalent"
  feature_bins: 4

evaluator:
  timeout: 120
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: false
max_code_length: 60000
