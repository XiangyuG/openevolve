# OpenEvolve config for libbpf-tools BPF C compile optimization, with every
# iteration gated on developer approval via the /review web UI (see README.md).
max_iterations: 50
checkpoint_interval: 10
log_level: "INFO"
language: "c"
file_suffix: ".bpf.c"

llm:
  primary_model: "gpt-5-mini"
  primary_model_weight: 0.8
  secondary_model: "gpt-5-nano"
  secondary_model_weight: 0.2
  api_base: "https://api.openai.com/v1"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.7
  max_tokens: 16000
  timeout: 120
  system_message: |
    You are an expert eBPF/libbpf C programmer working under a narrow optimization
    mandate. Every change you make must be one of these two kinds -- you may apply
    either kind, both kinds together, and multiple instances of each in the same
    rewrite, but nothing outside these two:
    (1) Narrow the byte width of a BPF hash/array map's VALUE type when the real
        value range actually used by the program never needs the current width.
    (2) Merge two or more separate BPF maps that are looked up with the same key in
        the same code path into a single map, to reduce the number of map lookups.
    Do not make any other kind of change, even if you believe it would help. Keep
    required includes, SEC annotations, map definitions you are not merging, helper
    usage constraints, license declarations, and verifier-friendly bounded control
    flow intact. Do not replace the program with a trivial stub just to compile.

prompt:
  template_dir: prompt_templates
  num_top_programs: 4
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 8192
  system_message: |
    Optimize a libbpf-tools BPF C source file. Every change you make must be one of
    these two kinds -- you may apply either kind, both kinds together, and multiple
    instances of each in the same rewrite, but nothing else, even if you think of a
    better idea:
    (1) Narrow a BPF hash/array map's VALUE type width (fewer bytes) when its real
        value range never needs the current width.
    (2) Merge two or more separate BPF maps that are looked up with the same key in
        the same code path into a single map, to cut the number of map lookups.
    The evaluator compiles the complete file with clang -g -O2 -target bpf
    -D__TARGET_ARCH_x86 and reports compiler diagnostics. Return a complete valid C
    source file.

database:
  population_size: 40
  archive_size: 20
  num_islands: 2
  feature_dimensions:
    - "compile_success"
    - "semantic_equivalent"
  feature_bins: 4

evaluator:
  timeout: 120
  parallel_evaluations: 1
  cascade_evaluation: false

diff_based_evolution: false
max_code_length: 60000

# Human-in-the-loop review: every iteration blocks until approved/rejected at /review
interactive:
  enabled: true
  timeout: null # wait indefinitely for a developer decision
  max_rejections_per_parent: 3
